  Mesa RPG - Snippets HTML do sistema de dados v22
  Use os IDs como estão ou altere os seletores no MesaRpgDice.init({ selectors: {...} }).

<!-- Painel lateral completo de rolagem -->
<section class="panel dice-panel">
  <h2>Rolagem de dados 3D</h2>
  <p>Role dados com animação física. A rolagem pública aparece também na TV.</p>

  <div class="quick-grid">
    <div class="field">
      <label for="diceTypeSelect">Dado</label>
      <select id="diceTypeSelect">
        <option value="4">d4</option>
        <option value="6">d6</option>
        <option value="8">d8</option>
        <option value="10">d10</option>
        <option value="12">d12</option>
        <option value="20" selected>d20</option>
        <option value="100">d100</option>
      </select>
    </div>

    <div class="field">
      <label for="diceCountInput">Quantidade</label>
      <input id="diceCountInput" type="number" min="1" max="20" value="1" />
    </div>
  </div>

  <div class="quick-grid">
    <div class="field">
      <label for="diceModifierInput">Modificador</label>
      <input id="diceModifierInput" type="number" step="1" value="0" />
    </div>

    <div class="field">
      <label for="diceModeSelect">Modo</label>
      <select id="diceModeSelect">
        <option value="normal">Normal</option>
        <option value="advantage">Vantagem</option>
        <option value="disadvantage">Desvantagem</option>
      </select>
    </div>

    <div class="field">
      <label for="diceColorInput">Cor dos dados</label>
      <input id="diceColorInput" type="color" value="#14b8a6" />
    </div>
  </div>

  <div class="field">
    <label for="diceLabelInput">Nome da rolagem</label>
    <input id="diceLabelInput" type="text" placeholder="Ex: Ataque do Wilhelm / Percepção" />
  </div>

  <div class="dice-quick-buttons">
    <button data-dice="4">d4</button>
    <button data-dice="6">d6</button>
    <button data-dice="8">d8</button>
    <button data-dice="10">d10</button>
    <button data-dice="12">d12</button>
    <button data-dice="20">d20</button>
    <button data-dice="100">d100</button>
  </div>

  <div class="buttons two" style="margin-top: 8px;">
    <button id="rollPublicDiceBtn" class="success">Rolar na TV</button>
    <button id="rollPrivateDiceBtn" class="primary">Só mestre</button>
  </div>

  <div id="diceHistoryList" class="dice-history-list">
    <div class="library-empty">Nenhuma rolagem ainda.</div>
  </div>
</section>

<!-- Barra rápida para ficar perto da toolbar principal -->
<div class="quick-dice-toolbar" id="quickDiceToolbar">
  <div class="quick-dice-status" id="quickDicePoolLabel">Dados: vazio</div>
  <button class="quick-die-btn" data-quick-die="4">D4</button>
  <button class="quick-die-btn" data-quick-die="6">D6</button>
  <button class="quick-die-btn" data-quick-die="8">D8</button>
  <button class="quick-die-btn" data-quick-die="10">D10</button>
  <button class="quick-die-btn" data-quick-die="12">D12</button>
  <button class="quick-die-btn" data-quick-die="20">D20</button>
  <button class="quick-die-btn" data-quick-die="100">D100</button>
  <input class="quick-dice-mod" id="quickDiceModifierInput" type="text" value="+0" title="Modificador, exemplo: +4 ou -2" />
  <select class="quick-dice-mode" id="quickDiceModeSelect" title="Modo para d20">
    <option value="normal">Normal</option>
    <option value="advantage">Vant.</option>
    <option value="disadvantage">Desv.</option>
  </select>
  <input class="quick-dice-color" id="quickDiceColorInput" type="color" value="#14b8a6" title="Cor dos dados" />
  <button class="quick-roll-btn" id="quickRollDiceBtn">ROLAR</button>
  <button class="quick-clear-btn" id="quickClearDiceBtn" title="Limpar seleção de dados">Limpar</button>
</div>
