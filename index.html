<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mesa RPG - Espelho do Mestre</title>

  <!--Icons Google-->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <!--Link CSS-->
  <link rel="stylesheet" href="./css/index.css" />
  <link rel="stylesheet" href="./css/navbar.css" />
  <link rel="stylesheet" href="./css/second.css" />
  <link rel="stylesheet" href="./dados-v22-estilos.css" />
</head>

<body>

  <!--Aqui os mapas são mostrados na tela -->
  <div class="screen master-screen" id="masterPreview"></div>

  <!--Aqui eu seleciono os mapas que qro mostrar na tela-->
  <section class="panel" id="mapas-controle">
    <div class="header-mapas-controle">
      <img src="./assets/images/icons/Maps.png" alt="Ícone de mapas" class="icon-header" />
      <span class="material-symbols-outlined" id="icone-mapas-expandir">expand_circle_down</span>
    </div>

    <!--Tirar isso quebra a visualisação de mapas, deixar como display:"none"-->
    <div class="status" id="fileInfo" style="display: none;">Nenhum arquivo carregado.</div>

    <div id="libraryList" class="library-grid" style="margin-top: 8px;"></div>

    <div class="input-mapas-controle" id="input-mapas-controle">
      <input class="file-input" id="fileInput" type="file" aria-label="Selecionar arquivo" multiple
        accept="image/*,.jpg,.jpeg,.png,.webp,.gif,.bmp,.svg,.pdf,.txt,.md,.json,.csv,text/plain" />
      <span class="material-symbols-outlined"
        title="Aceita imagens JPG, PNG, WebP, GIF, BMP, SVG, PDF e TXT/MD. Limite prático: até 60 MB por arquivo.">help</span>
    </div>

    <!-- Criar Icones para os botões no estilo que já fiz-->
    <div class="buttons two" id="mapas-controle-button" style="margin-top: 8px;">
      <button id="showSelectedSmallBtn" class="success"><span
          class="material-symbols-outlined">visibility</span></button>
      <button id="removeSelectedBtn" class="danger"><span class="material-symbols-outlined">delete</span></button>
    </div>

    <div class="buttons two" style="margin-top: 7px; display: none;">
      <button id="clearLibraryBtn" class="danger">Limpar cenas</button>
      <button class="warning" id="hideBtn">Tela preta</button>
    </div>
  </section>


  <!--Controle de sons ambientes ///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////-->
  <section class="panel" id="sons-controle" style="display: none;">
    <div class="header-mapas-controle">
      <img src="./assets/images/icons/campfire.png" alt="Ícone de sons" class="icon-header" />
      <span class="material-symbols-outlined" id="icone-sons-expandir">expand_circle_down</span>
    </div>

    <div id="soundList" class="sound-list"></div>

  </section>


  <!--Biblioteca de vídeos do YouTube /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////-->
  <!--A Biblioteca ta com um bug chato, toda vez que eu adicono um vídeo, ele já vai para a tela no lugar do mapa , preciso corrigir isso-->
  <section class="panel" id="videos-youtube">

    <div class="field">
      <input id="youtubeLinkInput" type="text" placeholder="Ex:Cole o link do YouTube" />
    </div>

    <div class="field">
      <input id="youtubeTitleInput" type="text" placeholder="Ex: Mapa interativo / Música de batalha" style="display: none;" />
    </div>

    <div class="buttons two">
      <button id="addYoutubeBtn" class="success">Preparar vídeo</button>
      <button id="showYoutubeBtn" class="primary">Mostrar agora</button>
    </div>

    <div class="youtube-control-panel">
      <div id="youtubeControlBox" class="youtube-control-box">
        <div class="library-empty">Selecione ou prepare um vídeo para carregar o player.</div>
      </div>

      <div class="buttons four" id="controle-youtube" style="margin-top: 7px;">
        <button id="youtubePlayBtn" class="success"><img src="./assets/images/icons/Play.png"></button>
        <button id="youtubePauseBtn" class="warning"><img src="./assets/images/icons/pause.png"></button>
      </div>

      <!--Ocultar botões de controle avançado -->
      <div class="buttons three" style="margin-top: 7px; display: none;">
        <button id="youtubeStopBtn">Stop</button>
        <button id="youtubeMuteBtn">Mudo</button>
        <button id="youtubeUnmuteBtn">Som</button>
        <button id="youtubeBackBtn">-10s</button>
        <button id="youtubeForwardBtn">+10s</button>
      </div>

      <div class="field" style="margin-top: 8px;">
        <label for="youtubeVolumeRange">Volume sincronizado <span id="youtubeVolumeValue"
            class="range-value">70%</span></label>
        <input id="youtubeVolumeRange" type="range" min="0" max="100" step="1" value="70" />
      </div>
    </div>

    <div id="videoLibraryList" class="video-library-list" style="margin-top: 8px;">
      <div class="library-empty">Nenhum vídeo preparado.</div>
    </div>

    <div class="buttons two" style="margin-top: 8px;">
      <button id="removeYoutubeBtn" class="warning">Remover vídeo</button>
      <button id="clearYoutubeBtn" class="danger">Limpar vídeos</button>
    </div>

  </section>





  <!--Segunda Tela ////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////-->
  <div class="preview-area" id="previewArea">
    <div class="preview-stack" id="previewStack">

      <div class="toolbar-dock" id="toolbarDock">
        <div class="floating-toolbar" id="floatingToolbar">
          <button class="tool-btn toolbar-toggle" id="toolbarToggleBtn" title="Recolher/expandir barra">
            <span class="tool-icon" id="toolbarToggleIcon">⇤</span>
            <span id="toolbarToggleText">Recolher</span>
          </button>

          <button class="tool-btn" id="toggleGridBtn" title="Ativar/desativar grid">
            <span class="tool-icon">▦</span><span>Grid</span>
          </button>

          <button class="tool-btn" id="togglePointerBtn" title="Pointer">
            <span class="tool-icon">➤</span><span>Pointer</span>
          </button>

          <button class="tool-btn" id="toolLineBtn" title="Linha / Régua">
            <span class="tool-icon">─</span><span>Linha</span>
          </button>

          <button class="tool-btn" id="toolCircleBtn" title="Círculo">
            <span class="tool-icon">○</span><span>Círculo</span>
          </button>

          <button class="tool-btn" id="toolSquareBtn" title="Quadrado">
            <span class="tool-icon">□</span><span>Quad.</span>
          </button>

          <button class="tool-btn" id="toolConeBtn" title="Cone">
            <span class="tool-icon">◢</span><span>Cone</span>
          </button>

          <button class="tool-btn" id="clearMeasurementsToolBtn" title="Limpar todas as medições">
            <span class="tool-icon">⌫</span><span>Med.</span>
          </button>

          <button class="tool-btn" id="clearToolsBtn" title="Desativar ferramentas">
            <span class="tool-icon">✕</span><span>Tool</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <!--TUDO TA SENDO RENDERIZADO AQUI 😦😦-->
  <!--Vou trazer algumas coisas direto para o HTML para facilitar a manutenção-->
  <!--Da uma olhada no ./js/10-master.js-->
  <div id="app"></div>
  <!--Barra de navegação do Mestre-->
  <div class="nav-bar">
    <nav>
      <ul>
        <li id="mapas-icone"><img src="./assets/images/icons/Maps.png" alt="Ícone de mapas" title="Mapas"></li>
        <span><img src="./assets/images/icons/dado.png" alt="Ícone de dado"></span>
        <li id="sons-ambiente-icone"><img src="./assets/images/icons/campfire.png" alt="Ícone de fogueira"
            title="Sons Ambientes"></li>
      </ul>
    </nav>
  </div>


  <script src="./script/app.js"></script>
  <script src="./script/script.js"></script>
</body>

</html>
